<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ticket Detail - Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto p-6">
    <a href="/static/index.html" class="text-blue-600 text-sm">&larr; Back to tickets</a>
    <div id="content" class="mt-4"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ticketId = params.get("id");
    const content = document.getElementById("content");

    function statusColor(status) {
      if (status === "Open") return "bg-yellow-100 text-yellow-800";
      if (status === "In Progress") return "bg-blue-100 text-blue-800";
      if (status === "Closed") return "bg-green-100 text-green-800";
      return "bg-gray-100 text-gray-800";
    }

    async function loadTicket() {
      if (!ticketId) {
        content.innerHTML = `<p class="text-red-600">No ticket ID provided.</p>`;
        return;
      }

      const res = await fetch(`/api/tickets/${ticketId}`);
      if (!res.ok) {
        content.innerHTML = `<p class="text-red-600">Ticket not found.</p>`;
        return;
      }
      const t = await res.json();

      content.innerHTML = `
        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex justify-between items-start mb-4">
            <div>
              <h1 class="text-xl font-bold text-gray-800">${t.subject}</h1>
              <p class="text-sm text-gray-500 font-mono">${t.ticket_id}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-sm ${statusColor(t.status)}">${t.status}</span>
          </div>

          <div class="grid grid-cols-2 gap-3 text-sm mb-4 text-gray-700">
            <p><span class="font-medium">Customer:</span> ${t.customer_name}</p>
            <p><span class="font-medium">Email:</span> ${t.customer_email}</p>
            <p><span class="font-medium">Created:</span> ${new Date(t.created_at).toLocaleString()}</p>
            <p><span class="font-medium">Updated:</span> ${new Date(t.updated_at).toLocaleString()}</p>
          </div>

          <p class="text-gray-800 mb-6">${t.description}</p>

          <h2 class="font-semibold text-gray-700 mb-2">Notes</h2>
          <div class="space-y-2 mb-6">
            ${t.notes.length === 0
              ? `<p class="text-gray-400 text-sm">No notes yet.</p>`
              : t.notes.map(n => `
                  <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 text-sm">
                    <p>${n.note_text}</p>
                    <p class="text-xs text-gray-400 mt-1">${new Date(n.created_at).toLocaleString()}</p>
                  </div>
                `).join("")
            }
          </div>

          <form id="updateForm" class="border-t pt-4 space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Update Status</label>
              <select name="status" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                <option value="Open" ${t.status === "Open" ? "selected" : ""}>Open</option>
                <option value="In Progress" ${t.status === "In Progress" ? "selected" : ""}>In Progress</option>
                <option value="Closed" ${t.status === "Closed" ? "selected" : ""}>Closed</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Add Note</label>
              <textarea name="notes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
              Save Update
            </button>
          </form>
        </div>
      `;

      document.getElementById("updateForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const payload = Object.fromEntries(formData.entries());
        if (!payload.notes) delete payload.notes;

        await fetch(`/api/tickets/${ticketId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        loadTicket(); // re-render with fresh data
      });
    }

    loadTicket();
  </script>
</body>
</html>
