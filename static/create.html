<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Ticket - Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-xl mx-auto p-6">
    <a href="/static/index.html" class="text-blue-600 text-sm">&larr; Back to tickets</a>
    <h1 class="text-2xl font-bold text-gray-800 mt-2 mb-6">New Support Ticket</h1>

    <form id="ticketForm" class="bg-white p-6 rounded-lg shadow space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Customer Name</label>
        <input name="customer_name" required class="w-full border border-gray-300 rounded-lg px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Customer Email</label>
        <input name="customer_email" type="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
        <input name="subject" required class="w-full border border-gray-300 rounded-lg px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea name="description" rows="4" required class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
      </div>

      <p id="errorMsg" class="text-red-600 text-sm hidden"></p>

      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 w-full">
        Create Ticket
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById("ticketForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      const res = await fetch("/api/tickets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const err = await res.json();
        errorMsg.textContent = err.detail ? JSON.stringify(err.detail) : "Something went wrong.";
        errorMsg.classList.remove("hidden");
        return;
      }

      const data = await res.json();
      location.href = `/static/ticket.html?id=${data.ticket_id}`;
    });
  </script>
</body>
</html>
