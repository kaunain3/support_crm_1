<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Support Tickets</h1>
      <a href="/static/create.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
        + New Ticket
      </a>
    </div>

    <div class="flex gap-3 mb-4">
      <input
        id="searchInput"
        type="text"
        placeholder="Search by name, ID, email, description..."
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      />
      <select id="statusFilter" class="border border-gray-300 rounded-lg px-4 py-2">
        <option value="">All Status</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-gray-100 text-gray-600 text-sm">
          <tr>
            <th class="p-3">Ticket ID</th>
            <th class="p-3">Name</th>
            <th class="p-3">Subject</th>
            <th class="p-3">Status</th>
            <th class="p-3">Date</th>
          </tr>
        </thead>
        <tbody id="ticketTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const tableBody = document.getElementById("ticketTableBody");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");

    let debounceTimer;

    async function loadTickets() {
      const params = new URLSearchParams();
      if (searchInput.value) params.set("search", searchInput.value);
      if (statusFilter.value) params.set("status", statusFilter.value);

      const res = await fetch(`/api/tickets?${params.toString()}`);
      const tickets = await res.json();

      tableBody.innerHTML = tickets.map(t => `
        <tr class="border-t hover:bg-gray-50 cursor-pointer" onclick="location.href='/static/ticket.html?id=${t.ticket_id}'">
          <td class="p-3 font-mono text-sm">${t.ticket_id}</td>
          <td class="p-3">${t.customer_name}</td>
          <td class="p-3">${t.subject}</td>
          <td class="p-3">
            <span class="px-2 py-1 rounded-full text-xs ${statusColor(t.status)}">${t.status}</span>
          </td>
          <td class="p-3 text-sm text-gray-500">${new Date(t.created_at).toLocaleDateString()}</td>
        </tr>
      `).join("");

      if (tickets.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">No tickets found</td></tr>`;
      }
    }

    function statusColor(status) {
      if (status === "Open") return "bg-yellow-100 text-yellow-800";
      if (status === "In Progress") return "bg-blue-100 text-blue-800";
      if (status === "Closed") return "bg-green-100 text-green-800";
      return "bg-gray-100 text-gray-800";
    }

    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadTickets, 300);
    });

    statusFilter.addEventListener("change", loadTickets);

    loadTickets();
  </script>
</body>
</html>
